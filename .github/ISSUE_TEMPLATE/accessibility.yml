name: 사용성 또는 접근성 문제 제보
description: 키보드, 화면 크기, 글자 읽기나 조작 중 겪은 문제를 알려 주세요.
title: "[사용성] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 있었나요?
      description: 화면, 사용한 조작, 기대한 결과를 적어 주세요. 개인정보나 학습 기록 백업 파일은 올리지 마세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 다시 확인하는 방법 (선택)
      description: 문제를 확인할 수 있는 단계나 브라우저·화면 너비를 적어 주세요.
    validations:
      required: false
